[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zed-mcp"
version = "0.1.0"
description = "MCP server for Zed editor — extension management, settings, collaborator bridge"
requires-python = ">=3.11"
dependencies = ["fastmcp>=3.4.2,<4"]

[project.scripts]
zed-mcp = "zed_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zed_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
